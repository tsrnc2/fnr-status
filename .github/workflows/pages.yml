# Deploy GitHub Pages for tsrnc2/fnr-status (public).
# EXPERIMENTAL / not FNR-000. Site content is committed status.json + index.html only.
name: Deploy FNR status Pages
on:
  push:
    branches: [main]
  schedule:
    # Re-deploy every 30 minutes on weekdays (UTC). Content only changes when a snapshot is pushed.
    - cron: "*/30 * * * 1-5"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
